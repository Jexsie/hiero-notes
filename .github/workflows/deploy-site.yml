name: Deploy briefings site

# Builds the Next.js site in site/ and publishes it to GitHub Pages:
#   - the briefing pages, from briefings/*.md
#   - the Pulse dashboard, from data fetched here by scripts/fetch_pulse.py (not committed)
# Runs whenever a briefing, the site or the fetch script changes on main, and daily so Pulse stays fresh.

on:
  push:
    branches: [main]
    paths:
      - "briefings/**"
      - "site/**"
      - "scripts/fetch_pulse.py"
      - ".github/workflows/deploy-site.yml"
  schedule:
    # 03:00 UTC = 06:00 in Kampala, after the 05:00 activity fetch.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - id: pages
        uses: actions/configure-pages@v6

      - run: npm ci

      - name: Fetch Pulse data
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/fetch_pulse.py --user jexsie

      - name: Build static site
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
